[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-impact-simulator"
version = "0.1.0"
description = "Simulate how stakeholders react to a business decision using LLM agents, a knowledge graph and Monte Carlo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "litellm",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
    "langgraph",
    "numpy",
    "pandas",
    "networkx",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/decision_sim"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
