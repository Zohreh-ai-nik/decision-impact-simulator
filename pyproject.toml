[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-impact-simulator"
version = "0.1.0"
description = "Simulate how stakeholders react to a business decision using LLM agents, a knowledge graph and Monte Carlo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "litellm",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
    "langgraph",
    "numpy",
    "pandas",
    "networkx",
    "streamlit",
    "scikit-learn",
    "pyreadr",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
# Experiment tracking and plotting, used by the churn-model notebook and the
# optional MLflow logger. Not required to run the app or the test suite.
ml = [
    "mlflow",
    "matplotlib",
]
# Live web research via Tavily. Optional: the app runs offline with the Fake and
# Cached providers, and the test suite never calls the network.
research = [
    "tavily-python",
]
# Vector store for retrieval. Qdrant runs in-memory (QdrantClient(":memory:"))
# for tests and the offline demo; a Docker Qdrant is only needed for the full demo.
vectorstore = [
    "qdrant-client",
]
# Local embeddings (fastembed: small ONNX model, no API key, no cost). The
# optional LiteLLM embedder reuses the core `litellm` dependency.
embeddings = [
    "fastembed",
]
# Knowledge graph store. Neo4j is only needed for the full demo (Docker Neo4j);
# tests and the offline demo use the in-memory networkx backend (a core dep).
graph = [
    "neo4j",
]
# Cross-run agent memory. Mem0 is only needed for persistent/semantic recall; tests
# and the offline demo use the in-process InMemoryStore (no dependency).
memory = [
    "mem0ai",
]

[tool.hatch.build.targets.wheel]
packages = ["src/decision_sim"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
